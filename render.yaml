# Render Blueprint — deploys the whole platform (API + built UI in one Docker
# service) plus a managed Postgres database.
#
# In Render: New +  ->  Blueprint  ->  connect this GitHub repo. Render reads this
# file, creates the database and the web service, and wires DATABASE_URL for you.
# Then open the service's "Environment" tab and fill in the secret values marked
# `sync: false` below (Google Ads creds, an API_KEY, the Gemini key).
#
# Free tier notes:
#  * The free web service SLEEPS after ~15 min idle (first request after that is
#    slow) and the in-process weekly/sync jobs won't fire while it's asleep.
#  * For an always-on internal tool (reliable scheduler), set `plan: starter`.
#
# Database: this blueprint uses an EXTERNAL Postgres (e.g. Supabase free tier,
# which does not expire like Render's free DB). Set DATABASE_URL in the Render
# dashboard to your Supabase **Session pooler** URI (Project Settings -> Database
# -> Connection string -> Session pooler), which looks like:
#   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
# Use the Session pooler (port 5432, IPv4) — NOT the Direct connection (IPv6-only,
# unreachable from Render) and NOT the Transaction pooler (breaks prepared stmts).

services:
  - type: web
    name: ads-intelligence
    runtime: docker
    plan: free            # change to `starter` for always-on + working scheduler
    healthCheckPath: /api/v1/health
    autoDeploy: true      # redeploy on every push to the default branch
    envVars:
      # External Postgres (Supabase). Paste the Session-pooler URI in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Supabase free tier caps connections — keep the pool modest.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: APP_ENV
        value: production
      # Render is a READ-ONLY MIRROR: the local machine is the source of truth for
      # syncs/backfills, and its data is copied to Render. Keep Render's own
      # scheduler OFF so it can't sync concurrently (which duplicates rows) or grow
      # the DB toward the free-tier 1 GB cap. Also set this in the dashboard.
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOG_JSON
        value: "true"
      # --- Auth: set a strong value; users type it on the login screen ---
      - key: API_KEY
        sync: false
      # --- Google Ads API (set these in the Render dashboard) ---
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      # --- AI Ad Copy LLM (optional; falls back to deterministic if unset) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: AD_COPY_LLM_PROVIDER
        value: auto
      # --- Email (approval emails; team Gmail App Password) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
